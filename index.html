<style>
/* ========== CSS 变量 ========== */
:root{
  --primary:#e85d3a;
  --primary-dark:#d14a2a;
  --primary-light:#fef2ed;
  --bg:#f5f5f5;
  --card:#fff;
  --text:#222;
  --text-2:#666;
  --text-3:#999;
  --border:#e8e8e8;
  --green:#52c41a;
  --blue:#1890ff;
  --gold:#faad14;
  --radius:10px;
  --shadow:0 2px 8px rgba(0,0,0,.06);
  --shadow-lg:0 8px 30px rgba(0,0,0,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,textarea,select{font-family:inherit;outline:none}

/* ========== 顶部标题栏 ========== */
.header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:52px;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;
  box-shadow:0 2px 8px rgba(232,93,58,.3);
}
.header h1{font-size:18px;font-weight:600;letter-spacing:1px;flex:1;text-align:center}
.printer-btn{
  background:none;color:#fff;font-size:20px;padding:4px 8px;
  border-radius:6px;transition:background .2s;
}
.printer-btn:active{background:rgba(255,255,255,.2)}

/* ========== 底部 Tab 栏 ========== */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  height:56px;background:#fff;border-top:1px solid var(--border);
  display:flex;max-width:600px;margin:0 auto;
}
.tabbar-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:var(--text-3);font-size:11px;background:none;transition:color .2s;
}
.tabbar-item.active{color:var(--primary)}
.tabbar-item .icon{font-size:20px;line-height:1}

/* 批量操作底部栏 */
.batch-bar{
  position:fixed;bottom:56px;left:0;right:0;z-index:90;
  background:#fff;border-top:1px solid var(--border);
  padding:10px 12px;display:none;align-items:center;gap:8px;
  max-width:600px;margin:0 auto;box-shadow:0 -2px 8px rgba(0,0,0,.06);
}
.batch-bar.show{display:flex}

/* ========== 主内容区 ========== */
.main{
  padding-top:52px;padding-bottom:56px;
  height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  position:relative;
}
.page{display:none;padding:12px;max-width:600px;margin:0 auto}
.page.active{display:block}

/* 下拉刷新提示 */
.pull-refresh-hint{
  position:absolute;top:52px;left:0;right:0;text-align:center;
  padding:10px;font-size:13px;color:var(--text-3);
  transition:opacity .2s;opacity:0;pointer-events:none;z-index:50;
}
.pull-refresh-hint.show{opacity:1}
.pull-refresh-hint .spinner{display:inline-block;width:16px;height:16px;
  border:2px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ========== 通用组件 ========== */
.section-title{font-size:15px;font-weight:600;margin-bottom:10px;padding-left:2px;display:flex;align-items:center;justify-content:space-between}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:10px 20px;border-radius:8px;font-size:14px;font-weight:500;
  transition:opacity .2s;background:var(--primary);color:#fff;
}
.btn:active{opacity:.8}
.btn-block{display:flex;width:100%;padding:13px;font-size:16px}
.btn-outline{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn-gray{background:#f0f0f0;color:var(--text-2)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:6px}
.btn-danger{background:#fff;color:#ff4d4f;border:1px solid #ff4d4f}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* 分类 tab 条 */
.cat-tabs{
  display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;
  -ms-overflow-style:none;scrollbar-width:none;
}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{
  flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:13px;
  background:#fff;color:var(--text-2);white-space:nowrap;transition:all .2s;
}
.cat-tab.active{background:var(--primary);color:#fff}

/* 搜索框 */
.search-box{
  width:100%;padding:10px 14px;border:1px solid var(--border);
  border-radius:8px;font-size:14px;margin-bottom:10px;background:#fff;
}
.search-box:focus{border-color:var(--primary)}

/* ========== 点单台 ========== */
.order-layout{display:flex;flex-direction:column;gap:10px}
.dish-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dish-card{
  background:#fff;border-radius:var(--radius);padding:12px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform .1s;
}
.dish-card:active{transform:scale(.97)}
.dish-card.off{opacity:.4}
.dish-name{font-size:14px;font-weight:500;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dish-price{font-size:13px;color:var(--primary);font-weight:600}
.dish-price::before{content:"¥"}
.dish-badge{
  position:absolute;top:0;right:0;background:var(--primary);color:#fff;
  font-size:11px;padding:2px 8px;border-bottom-left-radius:8px;
}

/* 购物车面板 */
.cart-panel{
  background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;
}
.cart-header{
  padding:12px 14px;background:var(--primary-light);
  display:flex;justify-content:space-between;align-items:center;
  font-weight:600;font-size:14px;
}
.cart-header .count{color:var(--primary);font-size:13px}
.cart-empty{text-align:center;padding:30px 0;color:var(--text-3);font-size:14px}
.cart-item{padding:10px 14px;border-bottom:1px solid var(--border)}
.cart-item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cart-item-name{font-size:14px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cart-item-price{font-size:13px;color:var(--text-2)}
.cart-item-note{font-size:12px;color:var(--text-3);margin-bottom:6px}
.note-input{
  width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;
  font-size:12px;color:var(--text-2);margin-top:4px;
}
.qty-control{display:flex;align-items:center;gap:10px}
.qty-btn{
  width:28px;height:28px;border-radius:50%;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  background:var(--primary-light);color:var(--primary);
}
.qty-num{min-width:24px;text-align:center;font-size:15px;font-weight:500}
.cart-item-del{color:#ff4d4f;font-size:13px;background:none;padding:4px 8px}

.cart-footer{padding:12px 14px}
.table-input{
  width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;
  font-size:14px;margin-bottom:10px;
}
.order-note-input{
  width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;
  font-size:13px;margin-bottom:10px;resize:none;height:36px;
}
.cart-total{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;font-size:15px;
}
.cart-total .amount{font-size:22px;font-weight:700;color:var(--primary)}
.cart-total .amount::before{content:"¥"}

/* ========== 订单管理 ========== */
.order-tabs{display:flex;gap:8px;margin-bottom:12px}
.order-tab{
  flex:1;padding:8px;text-align:center;border-radius:8px;font-size:13px;
  background:#fff;color:var(--text-2);transition:all .2s;
}
.order-tab.active{background:var(--primary);color:#fff}
.order-card{
  background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
  margin-bottom:10px;overflow:hidden;
}
.order-card-header{
  padding:10px 14px;display:flex;justify-content:space-between;align-items:center;
  background:var(--primary-light);font-size:13px;
}
.order-card-header .left{display:flex;gap:10px;align-items:center}
.order-card-header .order-no{font-weight:600;color:var(--primary)}
.order-card-header .time{color:var(--text-3);font-size:12px}
.order-card-header .status-paid{
  background:var(--green);color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;
}
.order-card-header .status-pending{
  background:var(--gold);color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;
}
.order-card-body{padding:10px 14px}
.order-dish-row{
  display:flex;justify-content:space-between;padding:4px 0;font-size:13px;color:var(--text-2);
}
.order-dish-row .note{color:var(--text-3);font-size:12px}
.order-card-note{font-size:12px;color:var(--text-3);margin-top:6px;padding:6px 8px;background:#fafafa;border-radius:4px}
.order-card-footer{
  padding:10px 14px;border-top:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.order-total{font-size:16px;font-weight:600}
.order-total .amount{color:var(--primary)}
.order-total .amount::before{content:"¥"}
.payment-tag{font-size:11px;color:var(--text-3);margin-left:6px}

/* ========== 营业统计 ========== */
.stat-range{display:flex;gap:6px;margin-bottom:12px}
.stat-range-btn{
  flex:1;padding:7px;font-size:12px;border-radius:6px;
  background:#fff;color:var(--text-2);
}
.stat-range-btn.active{background:var(--primary);color:#fff}
.stat-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat-card{
  background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 10px;text-align:center;
}
.stat-card .label{font-size:11px;color:var(--text-3);margin-bottom:6px}
.stat-card .value{font-size:20px;font-weight:700;color:var(--primary)}
.stat-card .value::before{content:"¥"}
.stat-card .value.count::before{content:""}
.stat-card .value.avg::before{content:"¥"}
.stat-section{margin-bottom:16px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.bar-label{width:60px;flex-shrink:0;text-align:right;color:var(--text-2)}
.bar-track{flex:1;height:22px;background:#f0f0f0;border-radius:4px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:4px;transition:width .3s;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:#fff;font-size:11px;font-weight:500}
.bar-value{width:70px;flex-shrink:0;text-align:right;color:var(--text);font-weight:500}
.bar-value::before{content:"¥"}
.rank-item{
  display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);
}
.rank-num{
  width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;background:#f0f0f0;color:var(--text-3);flex-shrink:0;
}
.rank-num.top3{background:var(--primary);color:#fff}
.rank-info{flex:1;min-width:0}
.rank-name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-detail{font-size:11px;color:var(--text-3)}
.rank-sale{font-size:13px;font-weight:600;color:var(--primary)}
.trend-chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding:8px 0}
.trend-bar{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;
}
.trend-bar-fill{width:100%;max-width:30px;background:var(--primary);border-radius:4px 4px 0 0;min-height:2px;transition:height .3s;position:relative}
.trend-bar-fill:hover::after{
  content:attr(data-val);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  background:#333;color:#fff;padding:2px 6px;border-radius:4px;font-size:10px;white-space:nowrap;
}
.trend-bar-label{font-size:10px;color:var(--text-3)}
.empty-state{text-align:center;padding:40px 0;color:var(--text-3);font-size:14px}
/* 日结摘要 */
.daily-summary{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  border-radius:var(--radius);padding:16px;margin-bottom:12px;color:#fff;
}
.ds-title{font-size:15px;font-weight:600;margin-bottom:10px}
.ds-detail{display:flex;gap:8px;flex-wrap:wrap}
.ds-tag{
  background:rgba(255,255,255,.25);padding:4px 10px;border-radius:6px;
  font-size:12px;font-weight:500;
}

/* ========== 菜单管理 ========== */
.dish-mgmt-card{
  background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
  margin-bottom:10px;overflow:hidden;
}
.dish-mgmt-header{
  padding:10px 14px;background:var(--primary-light);font-weight:600;font-size:14px;
  display:flex;justify-content:space-between;align-items:center;
}
.dish-mgmt-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--border);
  transition:background .15s,opacity .15s,transform .15s;
}
.dish-mgmt-item:last-child{border-bottom:none}
.dish-mgmt-item.dragging{opacity:.4;background:var(--primary-light)}
.dish-mgmt-item.drag-over{border-top:3px solid var(--primary);padding-top:7px}
.dish-mgmt-item .drag-handle{font-size:18px;color:#ccc;cursor:grab;padding:0 4px;flex-shrink:0;user-select:none}
.dish-mgmt-item .drag-handle:active{cursor:grabbing}
.dish-mgmt-info{flex:1;min-width:0}
.dish-mgmt-name{font-size:14px;font-weight:500}
.dish-mgmt-price{font-size:13px;color:var(--primary);font-weight:600}
.dish-mgmt-price::before{content:"¥"}
.dish-mgmt-actions{display:flex;gap:6px;align-items:center}
.batch-checkbox{
  width:22px;height:22px;border:2px solid #ddd;border-radius:6px;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;transition:all .2s;
}
.batch-checkbox.checked{background:var(--primary);border-color:var(--primary);color:#fff}
.toggle-switch{
  position:relative;width:38px;height:20px;border-radius:10px;background:#ccc;transition:background .2s;
}
.toggle-switch.on{background:var(--green)}
.toggle-switch::after{
  content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;transition:left .2s;
}
.toggle-switch.on::after{left:20px}
.icon-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;background:none;color:var(--text-2)}

/* ========== 弹窗 ========== */
.modal-mask{
  position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;
  background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;
}
.modal-mask.show{display:flex}
.modal{
  background:#fff;border-radius:14px 14px 0 0;width:100%;max-width:600px;
  max-height:85vh;overflow-y:auto;animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{
  padding:14px;text-align:center;font-size:16px;font-weight:600;
  border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:1;
}
.modal-body{padding:14px}
.modal-footer{padding:12px 14px;display:flex;gap:10px;position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border)}

.form-group{margin-bottom:14px}
.form-label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px}
.form-input{
  width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;
}
.form-input:focus{border-color:var(--primary)}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}

.pay-methods{display:flex;gap:8px;margin-bottom:14px}
.pay-method{
  flex:1;padding:12px 4px;border:2px solid var(--border);border-radius:10px;
  text-align:center;font-size:12px;transition:all .2s;background:#fff;
}
.pay-method.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.pay-method .icon{font-size:15px;display:block;margin-bottom:4px;font-weight:700}
.pay-amount-box{
  background:var(--primary-light);border-radius:10px;padding:16px;text-align:center;margin-bottom:14px;
}
.pay-amount-box .label{font-size:13px;color:var(--text-2);margin-bottom:6px}
.pay-amount-box .amount{font-size:32px;font-weight:700;color:var(--primary)}
.pay-amount-box .amount::before{content:"¥"}
.change-box{
  display:flex;justify-content:space-between;align-items:center;padding:12px;
  background:#f6ffed;border:1px solid #b7eb8f;border-radius:8px;margin-bottom:14px;
}
.change-box .label{font-size:14px;color:var(--green)}
.change-box .amount{font-size:22px;font-weight:700;color:var(--green)}
.change-box .amount::before{content:"¥"}

/* ========== Toast ========== */
.toast{
  position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:300;
  background:rgba(0,0,0,.78);color:#fff;padding:10px 20px;border-radius:8px;
  font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1}

/* PWA 安装横幅 */
.install-banner{
  position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:250;
  background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.15);
  padding:14px 16px;display:none;align-items:center;gap:12px;
  max-width:340px;width:calc(100% - 24px);
  animation:slideUp .3s ease;border:1px solid var(--border);
}
.install-banner.show{display:flex}
.install-banner .icon{font-size:28px;flex-shrink:0}
.install-banner .text{flex:1;font-size:13px;color:var(--text-2)}
.install-banner .text strong{display:block;font-size:14px;color:var(--text);margin-bottom:2px}
.install-banner .install-btn{
  background:var(--primary);color:#fff;border:none;padding:8px 16px;
  border-radius:6px;font-size:13px;font-weight:500;white-space:nowrap;flex-shrink:0;
}
.install-banner .close-btn{
  background:none;border:none;font-size:18px;color:var(--text-3);padding:0 4px;flex-shrink:0;
}

/* ========== 响应式 ========== */
@media(min-width:700px){
  .order-layout{flex-direction:row;align-items:flex-start}
  .dish-grid-wrap{flex:1.3;min-width:0}
  .cart-panel{width:300px;flex-shrink:0;position:sticky;top:64px}
}

<script>
// ========== 预置数据 ==========
const DEFAULT_DISHES = [
  // 招牌菜
  {name:'红烧肉',price:38,category:'招牌菜'},
  {name:'糖醋排骨',price:42,category:'招牌菜'},
  {name:'水煮鱼',price:58,category:'招牌菜'},
  {name:'宫保鸡丁',price:32,category:'招牌菜'},
  // 荤菜
  {name:'回锅肉',price:28,category:'荤菜'},
  {name:'鱼香肉丝',price:26,category:'荤菜'},
  {name:'辣子鸡',price:38,category:'荤菜'},
  {name:'酸菜鱼',price:48,category:'荤菜'},
  {name:'京酱肉丝',price:32,category:'荤菜'},
  {name:'葱爆羊肉',price:45,category:'荤菜'},
  {name:'梅菜扣肉',price:35,category:'荤菜'},
  {name:'可乐鸡翅',price:30,category:'荤菜'},
  // 素菜
  {name:'麻婆豆腐',price:18,category:'素菜'},
  {name:'地三鲜',price:16,category:'素菜'},
  {name:'干煸豆角',price:18,category:'素菜'},
  {name:'蒜蓉西兰花',price:16,category:'素菜'},
  {name:'酸辣土豆丝',price:12,category:'素菜'},
  {name:'清炒时蔬',price:15,category:'素菜'},
  // 汤品
  {name:'西红柿鸡蛋汤',price:12,category:'汤品'},
  {name:'紫菜蛋花汤',price:10,category:'汤品'},
  {name:'酸萝卜老鸭汤',price:28,category:'汤品'},
  {name:'玉米排骨汤',price:25,category:'汤品'},
  // 主食
  {name:'米饭',price:2,category:'主食'},
  {name:'蛋炒饭',price:12,category:'主食'},
  {name:'扬州炒饭',price:15,category:'主食'},
  {name:'葱油拌面',price:12,category:'主食'},
  // 酒水
  {name:'可乐',price:5,category:'酒水'},
  {name:'雪碧',price:5,category:'酒水'},
  {name:'青岛啤酒',price:8,category:'酒水'},
  {name:'酸梅汤',price:6,category:'酒水'},
];

// ========== 数据层 ==========
const DB = {
  _k:{dishes:'rp_dishes',orders:'rp_orders',cart:'rp_cart',config:'rp_config',addons:'rp_addons'},
  _get(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}},
  _set(k,v){localStorage.setItem(k,JSON.stringify(v));if(CLOUD&&CLOUD.isConfigured())CLOUD.schedulePush()},

  getDishes(){
    let d=this._get(this._k.dishes,null);
    if(!d){
      d=DEFAULT_DISHES.map((x,i)=>({...x,id:'d'+Date.now()+i,available:true,sortOrder:i,createdAt:Date.now()+i}));
      this._set(this._k.dishes,d);
    }
    return d;
  },
  saveDishes(d){this._set(this._k.dishes,d)},
  getOrders(){return this._get(this._k.orders,[])},
  saveOrders(o){this._set(this._k.orders,o)},
  getCart(){return this._get(this._k.cart,{items:[],tableNumber:'',orderNote:''})},
  saveCart(c){this._set(this._k.cart,c)},
  // 全局加料项
  getAddons(){return this._get(this._k.addons,[])},
  saveAddons(a){this._set(this._k.addons,a)},
  getConfig(){
    let c=this._get(this._k.config,null);
    if(!c)c={orderSeq:0,printerName:''};
    return c;
  },
  saveConfig(c){this._set(this._k.config,c)},
  // 订单号 = 当天已有订单数 + 1，订单全删后从1开始，跨天也从1开始
  nextOrderNo(){
    const todayStart=this.getTodayStart();
    const todayOrders=state.orders.filter(o=>o.createdAt>=todayStart);
    return String(todayOrders.length+1);
  },
  getTodayStart(){
    const now=new Date();
    return new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  }
};

// ========== 云端同步 ==========
const CLOUD = {
  _timer: null,
  _pushing: false,  // 正在推送中
  _repo: 'hls-457/restaurant-pos',
  _branch: 'main',
  _file: 'data.json',

  getConfig(){
    try{
      return {
        token: localStorage.getItem('_cloud_token') || '',
        lastSync: localStorage.getItem('_cloud_lastSync') || '',   // ISO时间
        lastSyncTs: parseInt(localStorage.getItem('_cloud_lastSyncTs')||'0'),  // 毫秒时间戳
        enabled: localStorage.getItem('_cloud_enabled') === '1',
      };
    }catch(e){ return {token:'',lastSync:'',lastSyncTs:0,enabled:false}; }
  },
  saveConfig(cfg){
    localStorage.setItem('_cloud_token', cfg.token||'');
    localStorage.setItem('_cloud_lastSync', cfg.lastSync||'');
    localStorage.setItem('_cloud_lastSyncTs', String(cfg.lastSyncTs||0));
    localStorage.setItem('_cloud_enabled', cfg.enabled?'1':'0');
  },
  isConfigured(){
    return this.getConfig().enabled && !!this.getConfig().token;
  },

  // 从云端拉取 data.json
  async pull(){
    const cfg=this.getConfig();
    if(!cfg.token) return null;
    try{
      const resp=await fetch('https://api.github.com/repos/'+this._repo+'/contents/'+this._file+'?ref='+this._branch+'&t='+Date.now(), {
        headers:{'Authorization':'token '+cfg.token, 'Accept':'application/vnd.github.v3+json'},
        cache:'no-store'
      });
      if(resp.status===404) return {empty:true};
      if(!resp.ok) return null;
      const result=await resp.json();
      if(!result.content) return {empty:true};
      const text=atob(result.content.replace(/\n/g,''));
      const data=JSON.parse(decodeURIComponent(escape(text)));
      data._sha=result.sha;  // 保存SHA供下次push使用
      return data;
    }catch(e){ return null; }
  },

  // 推送数据到云端
  async push(){
    const cfg=this.getConfig();
    if(!cfg.token || this._pushing) return false;
    this._pushing=true;
    try{
      // 先获取最新SHA（避免冲突）
      let sha=null;
      try{
        const resp=await fetch('https://api.github.com/repos/'+this._repo+'/contents/'+this._file+'?ref='+this._branch, {
          headers:{'Authorization':'token '+cfg.token, 'Accept':'application/vnd.github.v3+json'},
          cache:'no-store'
        });
        if(resp.ok){
          const result=await resp.json();
          sha=result.sha;
        }
      }catch(e){}

      const data={
        dishes: DB.getDishes(),
        orders: DB.getOrders(),
        config: DB.getConfig(),
        syncTime: new Date().toISOString()
      };
      const content=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
      const body={message:'sync: '+new Date().toLocaleString(), content:content, branch:this._branch};
      if(sha) body.sha=sha;

      const resp=await fetch('https://api.github.com/repos/'+this._repo+'/contents/'+this._file, {
        method:'PUT',
        headers:{'Authorization':'token '+cfg.token, 'Accept':'application/vnd.github.v3+json', 'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      const result=await resp.json();
      if(result.content && result.content.sha){
        const now=new Date();
        this.saveConfig({
          token:cfg.token,
          lastSync:now.toLocaleString(),
          lastSyncTs:now.getTime(),
          enabled:true
        });
        return true;
      }
      return false;
    }catch(e){ return false; }
    finally{ this._pushing=false; }
  },

  // 防抖推送（3秒内只推一次）
  schedulePush(){
    if(!this.isConfigured()) return;
    if(this._timer) clearTimeout(this._timer);
    this._timer=setTimeout(async ()=>{
      const ok=await this.push();
      if(ok) showToast('☁️ 已自动同步', 1500);
    }, 3000);
  },

  // 检查云端是否有更新（不覆盖本地）
  async checkUpdate(){
    const cfg=this.getConfig();
    if(!cfg.token) return null;
    const cloudData=await this.pull();
    if(!cloudData || cloudData.empty) return null;
    const cloudTime=cloudData.syncTime?new Date(cloudData.syncTime).getTime():0;
    // 云端比上次同步时间更新 = 有新数据
    if(cloudTime > cfg.lastSyncTs){
      return cloudData;
    }
    return null;
  },

  // 用云端数据覆盖本地
  applyCloudData(cloudData){
    if(!cloudData || !cloudData.dishes) return false;
    DB.saveDishes(cloudData.dishes);
    if(cloudData.orders) DB.saveOrders(cloudData.orders);
    if(cloudData.config) DB.saveConfig(cloudData.config);
    // 更新同步时间
    const cloudTime=cloudData.syncTime?new Date(cloudData.syncTime).getTime():Date.now();
    const cfg=this.getConfig();
    this.saveConfig({
      token:cfg.token,
      lastSync:new Date(cloudTime).toLocaleString(),
      lastSyncTs:cloudTime,
      enabled:true
    });
    // 刷新页面数据
    state.dishes=DB.getDishes();
    state.orders=DB.getOrders();
    state.cart=DB.getCart();
    renderCatTabs();renderDishes();renderCart();renderOrders();renderMenuMgmt();
    return true;
  },

  disable(){
    this.saveConfig({token:'',lastSync:'',lastSyncTs:0,enabled:false});
  }
};

// ========== 状态 ==========
const state={
  dishes:[],
  orders:[],
  cart:{items:[],tableNumber:'',orderNote:''},
  currentCategory:'全部',
  searchKeyword:'',
  orderFilter:'pending',
  statRange:'today',
  checkoutOrder:null,
  editingDish:null,
  menuBatchMode:false,
  menuSelected:{},
};

// ========== 工具函数 ==========
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const fmtTime=ts=>{
  const d=new Date(ts);
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  const h=String(d.getHours()).padStart(2,'0');
  const min=String(d.getMinutes()).padStart(2,'0');
  return `${m}-${day} ${h}:${min}`;
};
const fmtTimeFull=ts=>{
  const d=new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
};
function showToast(msg){
  const t=$('#toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove('show'),2000);
}

function showInstallBanner(deferredPrompt){
  const banner=$('#installBanner');
  if(!banner||!deferredPrompt)return;
  // 3秒后显示
  setTimeout(()=>{
    banner.classList.add('show');
    $('#installBtn').onclick=async()=>{
      deferredPrompt.prompt();
      const{outcome}=await deferredPrompt.userChoice;
      if(outcome==='accepted')showToast('✅ 安装成功！');
      banner.classList.remove('show');
      deferredPrompt=null;
    };
    $('#installClose').onclick=()=>banner.classList.remove('show');
    // 15秒后自动隐藏
    setTimeout(()=>banner.classList.remove('show'),15000);
  },3000);
}
function confirmDialog(msg){
  return window.confirm(msg);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

// 获取所有分类
function getCategories(){
  const cats=new Set();
  state.dishes.forEach(d=>cats.add(d.category));
  return ['全部',...cats];
}

// ========== 页面切换 ==========
function switchPage(page){
  $$('.page').forEach(p=>p.classList.remove('active'));
  $('#page-'+page).classList.add('active');
  $$('.tabbar-item').forEach(t=>t.classList.toggle('active',t.dataset.page===page));
  // 页面切换时刷新数据
  if(page==='orders')renderOrders();
  if(page==='stats')renderStats();
  if(page==='menu')renderMenuMgmt();
  $('.main').scrollTop=0;
}

// ========== 点单台 ==========
function renderCatTabs(){
  const cats=getCategories();
  const html=cats.map(c=>`<button class="cat-tab ${c===state.currentCategory?'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');
  $('#catTabs').innerHTML=html;
}

function renderDishes(){
  let list=state.dishes.filter(d=>d.available).sort((a,b)=>a.sortOrder-b.sortOrder);
  if(state.currentCategory!=='全部')list=list.filter(d=>d.category===state.currentCategory);
  if(state.searchKeyword){
    const kw=state.searchKeyword.toLowerCase();
    list=list.filter(d=>d.name.toLowerCase().includes(kw));
  }
  if(!list.length){
    $('#dishGrid').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:30px;color:#999">没有找到菜品</div>';
    return;
  }
  const html=list.map(d=>{
    const inCart=state.cart.items.find(i=>i.dishId===d.id);
    const hasAddons=d.addons&&d.addons.length>0;
    return `<div class="dish-card" onclick="addToCart('${d.id}')">
      ${inCart?`<div class="dish-badge">${inCart.qty}</div>`:''}
      <div class="dish-name">${escapeHtml(d.name)}${hasAddons?' <span style="font-size:10px;color:#fa8c16">+加料</span>':''}</div>
      <div class="dish-price">${d.price}</div>
    </div>`;
  }).join('');
  $('#dishGrid').innerHTML=html;
}

function addToCart(dishId){
  const dish=state.dishes.find(d=>d.id===dishId);
  if(!dish)return;
  // 如果有加料项，弹出选择框
  if(dish.addons && dish.addons.length>0){
    showAddonPicker(dish);
    return;
  }
  // 没有加料项，直接加入
  const item=state.cart.items.find(i=>i.dishId===dishId && !i.addons);
  if(item){
    item.qty++;
  }else{
    state.cart.items.push({dishId:dishId,name:dish.name,price:dish.price,qty:1,note:'',addons:[]});
  }
  DB.saveCart(state.cart);
  renderCart();
  renderDishes();
}

function showAddonPicker(dish){
  const addonHtml=dish.addons.map((a,i)=>`
    <label style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer">
      <span style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" class="addon-checkbox" data-idx="${i}" style="width:18px;height:18px">
        <span style="font-size:14px">${escapeHtml(a.name)}</span>
      </span>
      <span style="color:var(--primary);font-weight:600">+${a.price}元</span>
    </label>
  `).join('');
  
  $('#modalMask').innerHTML=`
    <div class="modal">
      <div class="modal-header">${escapeHtml(dish.name)} - 选择加料</div>
      <div class="modal-body">
        <div style="font-size:13px;color:#999;margin-bottom:12px">基础价格 ${dish.price}元，勾选需要的加料：</div>
        ${addonHtml}
      </div>
      <div class="modal-footer">
        <button class="btn btn-gray" style="flex:1" onclick="closeModal()">取消</button>
        <button class="btn" style="flex:2" onclick="confirmAddToCart('${dish.id}')">加入购物车</button>
      </div>
    </div>
  `;
  $('#modalMask').classList.add('show');
}

function confirmAddToCart(dishId){
  const dish=state.dishes.find(d=>d.id===dishId);
  if(!dish)return;
  // 获取选中的加料
  const checkboxes=document.querySelectorAll('.addon-checkbox');
  const selectedAddons=[];
  checkboxes.forEach(cb=>{
    if(cb.checked){
      const idx=parseInt(cb.dataset.idx);
      selectedAddons.push(dish.addons[idx]);
    }
  });
  // 计算单价 = 基础价 + 加料价
  const addonTotal=selectedAddons.reduce((s,a)=>s+a.price,0);
  const unitPrice=dish.price+addonTotal;
  
  // 检查购物车中是否已有完全相同的组合（同菜品+同加料）
  const addonKey=selectedAddons.map(a=>a.name).sort().join(',');
  const existing=state.cart.items.find(i=>
    i.dishId===dishId && 
    i.addons &&
    i.addons.map(a=>a.name).sort().join(',')===addonKey
  );
  if(existing){
    existing.qty++;
  }else{
    state.cart.items.push({
      dishId:dishId,
      name:dish.name,
      price:unitPrice,
      basePrice:dish.price,
      qty:1,
      note:'',
      addons:selectedAddons
    });
  }
  DB.saveCart(state.cart);
  closeModal();
  renderCart();
  renderDishes();
}

function changeQty(dishId,delta){
  const item=state.cart.items.find(i=>i.dishId===dishId);
  if(!item)return;
  item.qty+=delta;
  if(item.qty<=0){
    state.cart.items=state.cart.items.filter(i=>i.dishId!==dishId);
  }
  DB.saveCart(state.cart);
  renderCart();
  renderDishes();
}

function removeFromCart(dishId){
  state.cart.items=state.cart.items.filter(i=>i.dishId!==dishId);
  DB.saveCart(state.cart);
  renderCart();
  renderDishes();
}

function updateCartNote(dishId,note){
  const item=state.cart.items.find(i=>i.dishId===dishId);
  if(item){item.note=note;DB.saveCart(state.cart)}
}

function renderCart(){
  const items=state.cart.items;
  const total=items.reduce((s,i)=>s+i.price*i.qty,0);
  const totalCount=items.reduce((s,i)=>s+i.qty,0);

  $('#cartCount').textContent=totalCount?`${totalCount} 件`:'';

  if(!items.length){
    $('#cartItems').innerHTML='<div class="cart-empty">购物车空空如也<br>点击左侧菜品添加</div>';
    $('#cartFooter').style.display='none';
    return;
  }

  const html=items.map(i=>{
    const addonText=i.addons&&i.addons.length?i.addons.map(a=>`+${escapeHtml(a.name)}(${a.price}元)`).join(' '):'';
    return `<div class="cart-item">
    <div class="cart-item-top">
      <span class="cart-item-name">${escapeHtml(i.name)}${addonText?` <span style="font-size:12px;color:#fa8c16">${addonText}</span>`:''}</span>
      <span class="cart-item-price">¥${(i.price*i.qty).toFixed(2)}</span>
    </div>
    <input class="note-input" placeholder="备注（如少辣、不要葱）" value="${escapeHtml(i.note)}" onchange="updateCartNote('${i.dishId}',this.value)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
      <div class="qty-control">
        <button class="qty-btn" onclick="changeQty('${i.dishId}',-1)">−</button>
        <span class="qty-num">${i.qty}</span>
        <button class="qty-btn" onclick="changeQty('${i.dishId}',1)">+</button>
      </div>
      <button class="cart-item-del" onclick="removeFromCart('${i.dishId}')">删除</button>
    </div>
  </div>`;
  }).join('');

  $('#cartItems').innerHTML=html;
  $('#cartTotalAmount').textContent=total.toFixed(2);
  $('#orderNoteInput').value=state.cart.orderNote;
  $('#cartFooter').style.display='block';
}

function placeOrder(){
  if(!state.cart.items.length){showToast('购物车是空的');return}

  const order={
    id:'o'+Date.now(),
    orderNumber:DB.nextOrderNo(),
    tableNumber:state.cart.tableNumber.trim(),
    items:state.cart.items.map(i=>({...i})),
    orderNote:state.cart.orderNote.trim(),
    subtotal:state.cart.items.reduce((s,i)=>s+i.price*i.qty,0),
    status:'pending',
    createdAt:Date.now(),
    paidAt:null,
    payment:null,
  };
  state.orders.unshift(order);
  DB.saveOrders(state.orders);

  // 清空购物车
  state.cart={items:[],tableNumber:'',orderNote:''};
  DB.saveCart(state.cart);
  renderCart();
  renderDishes();

  showToast(`✅ 下单成功！订单号 ${order.orderNumber}`);
  switchPage('orders');
}

// ========== 订单管理 ==========

  let list=state.orders;
  if(state.orderFilter!=='all')list=list.filter(o=>o.status===state.orderFilter);
  if(!list.length){
    $('#orderList').innerHTML='<div class="empty-state">暂无订单</div>';
    return;
  }
  const html=list.map(o=>{
    const itemsHtml=o.items.map(i=>{
      const addonText=i.addons&&i.addons.length?i.addons.map(a=>`+${escapeHtml(a.name)}`).join('、'):'';
      return `<div class="order-dish-row">
      <span>${escapeHtml(i.name)}${addonText?` <span style="font-size:12px;color:#fa8c16">（${addonText}）</span>`:''} ×${i.qty}${i.note?` <span class="note">（${escapeHtml(i.note)}）</span>`:''}</span>
      <span>¥${(i.price*i.qty).toFixed(2)}</span>
    </div>`;
    }).join('');
    const noteHtml=o.orderNote?`<div class="order-card-note">📝 ${escapeHtml(o.orderNote)}</div>`:'';
    const payTag=o.payment?`<span class="payment-tag">${o.payment.method==='cash'?'现金':o.payment.method==='wechat'?'微信':'支付宝'}</span>`:'';
    const statusHtml=o.status==='pending'
      ?`<span class="status-pending">未结</span>`
      :`<span class="status-paid">已结</span>`;

    return `<div class="order-card">
      <div class="order-card-header">
        <div class="left">
          <span class="order-no">#${o.orderNumber}</span>
          <span>${o.items.reduce((s,i)=>s+i.qty,0)} 件</span>
        </div>
        <span class="time">${fmtTime(o.createdAt)} ${statusHtml}</span>
      </div>
      <div class="order-card-body">
        ${itemsHtml}
        ${noteHtml}
      </div>
      <div class="order-card-footer">
        <span class="order-total">合计: <span class="amount">${o.subtotal.toFixed(2)}</span>${payTag}</span>
        <div style="display:flex;gap:8px">
          ${o.status==='pending'?`<button class="btn btn-sm" onclick="openCheckout('${o.id}')">结账</button>`:`<button class="btn btn-sm btn-outline" onclick="reopenCheckout('${o.id}')">改结账</button>`}
          ${o.status==='paid'?`<button class="btn btn-sm btn-gray" onclick="printOrder('${o.id}')">🖨️打印</button>`:''}
          <button class="btn btn-sm btn-gray" onclick="editOrder('${o.id}')">编辑</button>
          <button class="btn btn-sm btn-danger" onclick="cancelOrder('${o.id}')">取消</button>
        </div>
      </div>
    </div>`;
  }).join('');
  $('#orderList').innerHTML=html;
}

// ========== 编辑订单 ==========
function editOrder(orderId){
  const order=state.orders.find(o=>o.id===orderId);
  if(!order)return;
  state.editingOrder=order;
  renderEditOrderModal();
  $('#modalMask').classList.add('show');
}

function renderEditOrderModal(){
  const o=state.editingOrder;
  if(!o)return;
  const itemsHtml=o.items.map((i,idx)=>{
    const addonText=i.addons&&i.addons.length?i.addons.map(a=>`+${escapeHtml(a.name)}(${a.price}元)`).join(' '):'';
    return `<div class="cart-item" style="border-bottom:1px solid var(--border)">
    <div class="cart-item-top">
      <span class="cart-item-name">${escapeHtml(i.name)}${addonText?` <span style="font-size:12px;color:#fa8c16">${addonText}</span>`:''}</span>
      <span class="cart-item-price">¥${(i.price*i.qty).toFixed(2)}</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
      <div class="qty-control">
        <button class="qty-btn" onclick="editOrderQty(${idx},-1)">−</button>
        <span class="qty-num">${i.qty}</span>
        <button class="qty-btn" onclick="editOrderQty(${idx},1)">+</button>
      </div>
      <button class="cart-item-del" onclick="editOrderDel(${idx})">删除</button>
    </div>
  </div>`;
  }).join('');
  const html=`<div class="modal">
    <div class="modal-header">编辑订单 #${o.orderNumber}</div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">菜品列表</label>
        <div style="background:#fafafa;border-radius:8px;padding:8px;margin-bottom:8px">${itemsHtml||'<div style="text-align:center;padding:16px;color:#999">无菜品</div>'}</div>
      </div>
      <div class="form-group">
        <label class="form-label">整单备注</label>
        <textarea class="form-input" id="editNoteInput" rows="2" style="resize:vertical">${escapeHtml(o.orderNote||'')}</textarea>
      </div>
      <div class="pay-amount-box">
        <div class="label">订单金额</div>
        <div class="amount" id="editOrderTotal">${o.subtotal.toFixed(2)}</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-gray" style="flex:1" onclick="closeModal()">取消</button>
      <button class="btn" style="flex:2" onclick="saveEditOrder()">保存修改</button>
    </div>
  </div>`;
  $('#modalMask').innerHTML=html;
}

function syncEditFormToOrder(){
  const o=state.editingOrder;
  if(!o)return;
  const nInput=$('#editNoteInput');
  if(nInput)o.orderNote=nInput.value.trim();
}

function editOrderQty(idx,delta){
  syncEditFormToOrder();
  const o=state.editingOrder;
  if(!o||!o.items[idx])return;
  o.items[idx].qty+=delta;
  if(o.items[idx].qty<=0)o.items[idx].qty=1; // 最少1份，删除用删除按钮
  o.subtotal=o.items.reduce((s,i)=>s+i.price*i.qty,0);
  renderEditOrderModal();
}

function editOrderDel(idx){
  syncEditFormToOrder();
  const o=state.editingOrder;
  if(!o||!o.items[idx])return;
  o.items.splice(idx,1);
  o.subtotal=o.items.reduce((s,i)=>s+i.price*i.qty,0);
  renderEditOrderModal();
}

function saveEditOrder(){
  const o=state.editingOrder;
  if(!o)return;
  o.orderNote=$('#editNoteInput').value.trim();
  o.subtotal=o.items.reduce((s,i)=>s+i.price*i.qty,0);
  DB.saveOrders(state.orders);
  closeModal();
  state.editingOrder=null;
  renderOrders();
  showToast('已保存修改');
}

// ========== 改结账（已结账订单重新结账）==========
function reopenCheckout(orderId){
  const order=state.orders.find(o=>o.id===orderId);
  if(!order)return;
  // 重置为未结状态，重新走结账流程
  order.status='pending';
  order.paidAt=null;
  order.payment=null;
  DB.saveOrders(state.orders);
  renderOrders();
  // 直接打开结账弹窗
  openCheckout(orderId);
}

// ========== 取消订单 ==========
function cancelOrder(orderId){
  const order=state.orders.find(o=>o.id===orderId);
  if(!order)return;
  if(!confirmDialog(`确定取消订单 #${order.orderNumber} 吗？\n金额: ¥${order.subtotal.toFixed(2)}`))return;
  state.orders=state.orders.filter(o=>o.id!==orderId);
  DB.saveOrders(state.orders);
  renderOrders();
  showToast(`已取消订单 #${order.orderNumber}`);
}

// ========== 结账弹窗 ==========
function openCheckout(orderId){
  const order=state.orders.find(o=>o.id===orderId);
  if(!order)return;
  state.checkoutOrder={order,method:'wechat',received:''};
  renderCheckoutModal();
  $('#modalMask').classList.add('show');
}

function renderCheckoutModal(){
  const o=state.checkoutOrder;
  if(!o)return;
  const order=o.order;
  let changeHtml='';
  if(o.method==='cash'&&o.received){
    const change=Math.max(0,parseFloat(o.received)-order.subtotal);
    changeHtml=`<div class="change-box"><span class="label">找零</span><span class="amount">${change.toFixed(2)}</span></div>`;
  }

  const html=`<div class="modal">
    <div class="modal-header">结账 · #${order.orderNumber}</div>
    <div class="modal-body">
      <div style="margin-bottom:14px;font-size:13px;color:#666">
        ${fmtTimeFull(order.createdAt)}
      </div>
      <div class="card" style="background:#fafafa;margin-bottom:14px">
        ${order.items.map(i=>{
          const addonText=i.addons&&i.addons.length?i.addons.map(a=>`+${escapeHtml(a.name)}`).join('、'):'';
          return `<div class="order-dish-row">
          <span>${escapeHtml(i.name)}${addonText?` <span style="font-size:12px;color:#fa8c16">（${addonText}）</span>`:''} ×${i.qty}${i.note?` <span class="note">（${escapeHtml(i.note)}）</span>`:''}</span>
          <span>¥${(i.price*i.qty).toFixed(2)}</span>
        </div>`;
        }).join('')}
      </div>
      <div class="pay-amount-box">
        <div class="label">应付金额</div>
        <div class="amount">${order.subtotal.toFixed(2)}</div>
      </div>
      <div class="form-label">选择支付方式</div>
      <div class="pay-methods">
        <div class="pay-method ${o.method==='wechat'?'active':''}" onclick="setPayMethod('wechat')">
          <span class="icon" style="color:#52c41a">微信</span>扫码支付
        </div>
        <div class="pay-method ${o.method==='alipay'?'active':''}" onclick="setPayMethod('alipay')">
          <span class="icon" style="color:#1890ff">支付宝</span>扫码支付
        </div>
        <div class="pay-method ${o.method==='cash'?'active':''}" onclick="setPayMethod('cash')">
          <span class="icon" style="color:#faad14">现金</span>当面收款
        </div>
      </div>
      ${o.method==='cash'?`
        <div class="form-group">
          <label class="form-label">实收金额</label>
          <input type="number" class="form-input" placeholder="输入实收金额" value="${o.received}" oninput="onReceivedInput(this.value)" step="0.01">
        </div>
        ${changeHtml}
      `:''}
    </div>
    <div class="modal-footer">
      <button class="btn btn-gray" style="flex:1" onclick="closeModal()">取消</button>
      <button class="btn btn-outline" style="flex:1" onclick="confirmCheckout(true)">结账+打印</button>
      <button class="btn" style="flex:1.5" onclick="confirmCheckout(false)">确认结账</button>
    </div>
  </div>`;
  $('#modalMask').innerHTML=html;
}

function setPayMethod(m){
  state.checkoutOrder.method=m;
  state.checkoutOrder.received='';
  renderCheckoutModal();
}

function onReceivedInput(v){
  state.checkoutOrder.received=v;
  // 只更新找零部分，避免重绘 input 失焦
  const o=state.checkoutOrder;
  const order=o.order;
  const change=Math.max(0,parseFloat(v||0)-order.subtotal);
  let changeBox=$('.change-box');
  if(changeBox){
    changeBox.querySelector('.amount').textContent=change.toFixed(2);
  }
}

function confirmCheckout(printReceipt){
  const o=state.checkoutOrder;
  if(!o)return;
  const order=o.order;
  const payment={method:o.method,received:order.subtotal,change:0};
  if(o.method==='cash'){
    const received=parseFloat(o.received);
    if(!received||received<order.subtotal){
      showToast('实收金额不足');
      return;
    }
    payment.received=received;
    payment.change=Math.round((received-order.subtotal)*100)/100;
  }
  order.status='paid';
  order.paidAt=Date.now();
  order.payment=payment;
  DB.saveOrders(state.orders);
  closeModal();
  // 结账后切到"全部"让老板看到刚结的订单
  $$('.order-tab').forEach(x=>x.classList.remove('active'));
  const allTab=[...$$('.order-tab')].find(x=>x.dataset.status==='all');
  if(allTab)allTab.classList.add('active');
  state.orderFilter='all';
  renderOrders();
  showToast(`✅ 结账成功！${payment.method==='cash'?'现金':payment.method==='wechat'?'微信':'支付宝'} ¥${order.subtotal.toFixed(2)}`);
  if(printReceipt){
    setTimeout(()=>printReceiptForOrder(order),300);
  }
}

// ========== 蓝牙打印 ==========
const PRINTER_SERVICE_UUID=0x18F0; // 常见蓝牙热敏打印机服务 UUID
const PRINTER_CHAR_UUID=0x2AF1;   // 写数据特征 UUID
let btDevice=null,btChar=null;

// ========== 打印订单（补打小票）==========
function printOrder(orderId){
  const order=state.orders.find(o=>o.id===orderId);
  if(!order)return;
  printReceiptForOrder(order);
}

async function connectPrinter(){
  if(!navigator.bluetooth){
    showToast('当前浏览器不支持蓝牙，请用 Chrome');
    return false;
  }
  try{
    showToast('请在弹窗中选择您的打印机...');
    const device=await navigator.bluetooth.requestDevice({
      filters:[{services:[PRINTER_SERVICE_UUID]}],
      optionalServices:[PRINTER_SERVICE_UUID]
    });
    showToast('正在连接 '+device.name+'...');
    const server=await device.gatt.connect();
    const service=await server.getPrimaryService(PRINTER_SERVICE_UUID);
    btChar=await service.getCharacteristic(PRINTER_CHAR_UUID);
    btDevice=device;
    device.addEventListener('gattserverdisconnected',()=>{
      btDevice=null;btChar=null;
      showToast('打印机已断开');
    });
    showToast('✅ 已连接: '+device.name);
    // 保存打印机名到配置
    const cfg=DB.getConfig();cfg.printerName=device.name;DB.saveConfig(cfg);
    return true;
  }catch(e){
    if(e.name==='NotFoundError'){showToast('未选择打印机')}
    else{showToast('连接失败: '+e.message)}
    return false;
  }
}

function isPrinterConnected(){
  return btDevice&&btDevice.gatt.connected;
}

// ESC/POS 指令构建
function buildReceipt(order){
  const enc=new TextEncoder();
  const cmds=[];
  
  const push=(s)=>cmds.push(enc.encode(s));
  const pushBytes=(arr)=>cmds.push(new Uint8Array(arr));

  // 初始化打印机
  pushBytes([0x1B,0x40]);
  // 标题
  pushBytes([0x1B,0x61,0x01]); // 居中
  pushBytes([0x1D,0x21,0x11]); // 倍高倍宽
  push('餐馆小票\n');
  pushBytes([0x1D,0x21,0x00]); // 恢复
  pushBytes([0x1B,0x61,0x01]);
  push('——————————————\n');
  pushBytes([0x1B,0x61,0x00]); // 左对齐
  push(`订单号: #${order.orderNumber}\n`);
  push(`时间: ${fmtTimeFull(order.createdAt)}\n`);
  if(order.orderNote)push(`备注: ${order.orderNote}\n`);
  push('——————————————\n');
  pushBytes([0x1D,0x21,0x00]);
  // 菜品
  push('菜品            数量  金额\n');
  push('——————————————\n');
  order.items.forEach(i=>{
    let name=i.name;
    // 中文名补齐到约14字符
    const pad=Math.max(0,14-getDisplayWidth(name));
    let line=name+' '.repeat(pad);
    const qtyStr=String(i.qty).padStart(4,' ');
    const amtStr='¥'+(i.price*i.qty).toFixed(2);
    const amtPad=Math.max(0,10-getDisplayWidth(amtStr));
    push(line+qtyStr+' '.repeat(amtPad)+amtStr+'\n');
    if(i.note)push('  备注: '+i.note+'\n');
  });
  push('——————————————\n');
  // 合计
  pushBytes([0x1D,0x21,0x11]); // 倍高倍宽
  push('合计: ¥'+order.subtotal.toFixed(2)+'\n');
  pushBytes([0x1D,0x21,0x00]);
  // 支付
  if(order.payment){
    const payName=order.payment.method==='cash'?'现金':order.payment.method==='wechat'?'微信':'支付宝';
    push('支付方式: '+payName+'\n');
    if(order.payment.method==='cash'&&order.payment.received>order.subtotal){
      push('实收: ¥'+order.payment.received.toFixed(2)+'\n');
      push('找零: ¥'+order.payment.change.toFixed(2)+'\n');
    }
  }
  push('——————————————\n');
  pushBytes([0x1B,0x61,0x01]); // 居中
  push('感谢惠顾，欢迎再来！\n\n\n');
  // 走纸
  pushBytes([0x1B,0x64,0x03]);
  // 切纸
  pushBytes([0x1D,0x56,0x00]);
  
  // 合并所有命令
  let total=0;
  cmds.forEach(c=>total+=c.length);
  const result=new Uint8Array(total);
  let offset=0;
  cmds.forEach(c=>{result.set(c,offset);offset+=c.length});
  return result;
}

// 估算显示宽度（中文2，英文1）
function getDisplayWidth(s){
  let w=0;
  for(const ch of s){
    w+=/[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]/.test(ch)?2:1;
  }
  return w;
}

async function printReceiptForOrder(order){
  if(!isPrinterConnected()){
    const ok=await connectPrinter();
    if(!ok)return;
  }
  try{
    const data=buildReceipt(order);
    // 分包发送（BLE 单次最大约 180 字节）
    const chunkSize=180;
    for(let i=0;i<data.length;i+=chunkSize){
      const chunk=data.slice(i,i+chunkSize);
      await btChar.writeValueWithoutResponse(chunk);
      await new Promise(r=>setTimeout(r,40)); // 间隔避免丢包
    }
    showToast('✅ 打印完成');
  }catch(e){
    showToast('打印失败: '+e.message);
    // 尝试重连
    if(btDevice)btDevice.gatt.disconnect();
    btDevice=null;btChar=null;
  }
}

// ========== 营业统计 ==========
function getRangeStart(range){
  const now=new Date();
  const todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  if(range==='today')return todayStart;
  if(range==='7d')return todayStart-6*86400000;
  if(range==='30d')return todayStart-29*86400000;
  if(range==='week'){
    const day=now.getDay()||7; // 周日=7
    return todayStart-(day-1)*86400000;
  }
  return 0;
}

function renderStats(){
  const startTs=getRangeStart(state.statRange);
  const paidOrders=state.orders.filter(o=>o.status==='paid'&&o.paidAt>=startTs);

  const revenue=paidOrders.reduce((s,o)=>s+o.subtotal,0);
  const count=paidOrders.length;
  const avg=count?revenue/count:0;
  $('#statRevenue').textContent=revenue.toFixed(2);
  $('#statCount').textContent=count;
  $('#statAvg').textContent=avg.toFixed(2);

  // 日结摘要
  if(state.statRange==='today'){
    const now=new Date();
    const dateStr=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
    const payStats2={wechat:0,alipay:0,cash:0};
    paidOrders.forEach(o=>{if(o.payment)payStats2[o.payment.method]=(payStats2[o.payment.method]||0)+1});
    const payNames={wechat:'微信',alipay:'支付宝',cash:'现金'};
    const detailHtml=Object.entries(payStats2).filter(([_,v])=>v>0).map(([k,v])=>
      `<span class="ds-tag">${payNames[k]} ${v}单</span>`
    ).join('');
    $('#dailySummary').innerHTML=`<div class="daily-summary">
      <div class="ds-title">📊 ${dateStr} 日结</div>
      <div class="ds-detail">${detailHtml||'<span class="ds-tag">暂无</span>'}</div>
    </div>`;
  }else{
    $('#dailySummary').innerHTML='';
  }

  // 支付方式分布
  const payStats={wechat:0,alipay:0,cash:0};
  paidOrders.forEach(o=>{if(o.payment)payStats[o.payment.method]=(payStats[o.payment.method]||0)+o.subtotal});
  const payMax=Math.max(...Object.values(payStats),1);
  const payLabels={wechat:'微信',alipay:'支付宝',cash:'现金'};
  const payColors={wechat:'#52c41a',alipay:'#1890ff',cash:'#faad14'};
  const payHtml=Object.entries(payStats).filter(([_,v])=>v>0).map(([k,v])=>
    `<div class="bar-row">
      <span class="bar-label">${payLabels[k]}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${v/payMax*100}%;background:${payColors[k]}"></div></div>
      <span class="bar-value">${v.toFixed(2)}</span>
    </div>`
  ).join('');
  $('#payChart').innerHTML=payHtml||'<div class="empty-state">暂无数据</div>';

  // 菜品销量 TOP10
  const dishStats={};
  paidOrders.forEach(o=>{
    o.items.forEach(i=>{
      if(!dishStats[i.name])dishStats[i.name]={qty:0,revenue:0};
      dishStats[i.name].qty+=i.qty;
      dishStats[i.name].revenue+=i.price*i.qty;
    });
  });
  const ranked=Object.entries(dishStats).sort((a,b)=>b[1].qty-a[1].qty).slice(0,10);
  const rankMax=ranked.length?ranked[0][1].qty:1;
  const rankHtml=ranked.map((e,idx)=>{
    const [name,s]=e;
    return `<div class="rank-item">
      <div class="rank-num ${idx<3?'top3':''}">${idx+1}</div>
      <div class="rank-info">
        <div class="rank-name">${escapeHtml(name)}</div>
        <div class="rank-detail">销量 ${s.qty} 份 · 销售额 ¥${s.revenue.toFixed(2)}</div>
      </div>
      <div class="rank-sale">${s.qty}</div>
    </div>`;
  }).join('');
  $('#rankChart').innerHTML=rankHtml||'<div class="empty-state">暂无数据</div>';

  // 每日营业额趋势
  const days=state.statRange==='today'?1:state.statRange==='week'?7:state.statRange==='7d'?7:30;
  const trendData=[];
  const todayStart=new Date();
  todayStart.setHours(0,0,0,0);
  for(let i=days-1;i>=0;i--){
    const dayStart=new Date(todayStart.getTime()-i*86400000);
    const dayEnd=new Date(dayStart.getTime()+86400000);
    const dayRev=paidOrders.filter(o=>o.paidAt>=dayStart.getTime()&&o.paidAt<dayEnd.getTime()).reduce((s,o)=>s+o.subtotal,0);
    trendData.push({date:dayStart,rev:dayRev});
  }
  const trendMax=Math.max(...trendData.map(d=>d.rev),1);
  const trendHtml=`<div class="trend-chart">${trendData.map(d=>{
    const h=Math.max(2,d.rev/trendMax*100);
    const label=d.date.getDate();
    return `<div class="trend-bar">
      <div class="trend-bar-fill" style="height:${h}%" data-val="¥${d.rev.toFixed(2)}"></div>
      <div class="trend-bar-label">${label}日</div>
    </div>`;
  }).join('')}</div>`;
  $('#trendChart').innerHTML=trendHtml;
}

}

}

function toggleSelectAll(){
  const allSelected=state.dishes.every(d=>state.menuSelected[d.id]);
  state.dishes.forEach(d=>{state.menuSelected[d.id]=!allSelected});

}

function deleteSelected(){
  const ids=Object.keys(state.menuSelected).filter(id=>state.menuSelected[id]);

  if(!confirmDialog(`确定删除选中的 ${ids.length} 个菜品吗？`))return;

  state.menuSelected={};

async function enableCloud(){
  const token=$('#cloudTokenInput').value.trim();
  if(!token){showToast('请输入GitHub Token');return}
  showToast('正在检查云端...');
  // 保存token，先不开启
  CLOUD.saveConfig({token:token, lastSync:'', lastSyncTs:0, enabled:true});
  // 检查云端是否有数据
  const cloudData=await CLOUD.pull();
  if(cloudData && !cloudData.empty && cloudData.dishes){
    // 云端有数据，让用户选择
    const cloudCount=cloudData.dishes.length;
    const localCount=DB.getDishes().length;
    const cloudTime=cloudData.syncTime?new Date(cloudData.syncTime).toLocaleString():'未知';
    $('#modalMask').innerHTML=`
      <div class="modal-title">🔄 云端已有数据</div>
      <div style="padding:16px 0">
        <div style="padding:12px;border-radius:8px;margin-bottom:12px;background:#fff7e6;border:1px solid #ffd591">
          <div style="font-size:13px;color:#666;margin-bottom:6px">
            云端有 <b>${cloudCount}</b> 个菜品（同步时间：${cloudTime}）<br>
            本地有 <b>${localCount}</b> 个菜品
          </div>
          <div style="font-size:13px;color:#ff4d4f;font-weight:600;margin-bottom:12px">请选择以哪个为准：</div>
        </div>
        <button class="btn" style="width:100%;margin-bottom:8px;background:#52c41a" onclick="cloudUploadFirst()">⬆️ 以本地为准（上传覆盖云端）</button>
        <p style="font-size:12px;color:#999;margin-bottom:12px;padding-left:4px">把当前设备的数据上传到云端</p>
        <button class="btn" style="width:100%;margin-bottom:8px;background:#1890ff" onclick="cloudDownloadFirst()">⬇️ 以云端为准（下载覆盖本地）</button>
        <p style="font-size:12px;color:#999;margin-bottom:12px;padding-left:4px">用云端数据替换当前设备数据</p>
        <button class="btn btn-outline" style="width:100%" onclick="disableCloud()">取消，不同步</button>
      </div>
    `;
    window._cloudPendingData=cloudData;
  }else{
    // 云端无数据，直接上传本地
    showToast('正在上传...');
    const ok=await CLOUD.push();
    if(ok){
      showToast('✅ 云端同步已开启，数据已上传！');
      closeModal();
    }else{
      showToast('❌ 上传失败，请检查Token');
      CLOUD.disable();
    }
  }
}

async function cloudUploadFirst(){

async function cloudDownloadFirst(){

  CLOUD.applyCloudData(cloudData);

  window._cloudUpdate=null;
  closeModal();
}

async function cloudDownloadUpdate(){

  CLOUD.applyCloudData(update.data);

  closeModal();
}

function doRestore(){
  const code=$('#restoreCode').value.trim();
  if(!code){showToast('请粘贴备份码');return}
  try{
    const json=decodeURIComponent(escape(atob(code)));
    const data=JSON.parse(json);
    if(!data.dishes){showToast('备份码格式错误');return}
    if(!confirmDialog('确定恢复数据吗？这将覆盖当前所有菜品和订单！'))return;
    DB.saveDishes(data.dishes);
    if(data.orders)DB.saveOrders(data.orders);
    if(data.config)DB.saveConfig(data.config);
    state.dishes=DB.getDishes();
    state.orders=DB.getOrders();
    state.cart={items:[],tableNumber:'',orderNote:''};
    DB.saveCart(state.cart);
    renderCatTabs();
    renderDishes();
    renderCart();
    renderOrders();
    renderMenuMgmt();
    closeModal();
    showToast('✅ 数据恢复成功！');
  }catch(e){
    showToast('❌ 备份码无效，请检查');
  }
}

// ========== 菜品拖拽排序 ==========
let _dragDishId=null;

function onDishDragStart(e,dishId){
  _dragDishId=dishId;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',dishId);
}

function onDishDragOver(e,dishId){
  if(!_dragDishId||_dragDishId===dishId)return;
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  // 找到当前 item 元素
  const item=e.currentTarget;
  if(item)item.classList.add('drag-over');
}

function onDishDragLeave(e){
  e.currentTarget.classList.remove('drag-over');
}

function onDishDrop(e,targetDishId){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if(!_dragDishId||_dragDishId===targetDishId)return;
  // 交换两个菜品的 sortOrder
  const fromDish=state.dishes.find(d=>d.id===_dragDishId);
  const toDish=state.dishes.find(d=>d.id===targetDishId);
  if(!fromDish||!toDish)return;
  // 确保同一分类内排序
  if(fromDish.category!==toDish.category){
    showToast('只能在同一分类内排序');
    _dragDishId=null;
    return;
  }
  const tmp=fromDish.sortOrder;
  fromDish.sortOrder=toDish.sortOrder;
  toDish.sortOrder=tmp;
  DB.saveDishes(state.dishes);
  _dragDishId=null;
  renderMenuMgmt();
  showToast('顺序已更新');
}

// 长按触屏拖拽支持（移动端）
let _touchDragId=null;
let _touchTimer=null;

function onDishTouchStart(e,dishId){
  _touchDragId=dishId;
  _touchTimer=setTimeout(()=>{
    // 长按触发，添加拖拽样式
    e.currentTarget.classList.add('dragging');
    navigator.vibrate&&navigator.vibrate(50);
  },500);
}

function onDishTouchMove(e){
  if(!_touchDragId)return;
  clearTimeout(_touchTimer);
  const touch=e.touches[0];
  const target=document.elementFromPoint(touch.clientX,touch.clientY);
  // 清除所有 drag-over
  document.querySelectorAll('.dish-mgmt-item.drag-over').forEach(el=>el.classList.remove('drag-over'));
  // 找到当前悬停的 item
  const item=target?target.closest('.dish-mgmt-item'):null;
  if(item&&item.dataset.dishId&&item.dataset.dishId!==_touchDragId){
    item.classList.add('drag-over');
  }
}

function onDishTouchEnd(e){
  clearTimeout(_touchTimer);
  if(!_touchDragId)return;
  document.querySelectorAll('.dish-mgmt-item.dragging').forEach(el=>el.classList.remove('dragging'));
  document.querySelectorAll('.dish-mgmt-item.drag-over').forEach(el=>el.classList.remove('drag-over'));
  const touch=e.changedTouches[0];
  const target=document.elementFromPoint(touch.clientX,touch.clientY);
  const dropItem=target?target.closest('.dish-mgmt-item'):null;
  if(dropItem&&dropItem.dataset.dishId&&dropItem.dataset.dishId!==_touchDragId){
    onDishDrop({preventDefault:()=>{},currentTarget:dropItem},dropItem.dataset.dishId);
  }
  _touchDragId=null;
}

function showBatchMgmtAddon(){

  area.style.display=area.style.display==='none'?'block':'none';

}

function applyBatchMgmtAddon(){
  const text=$('#batchMgmtInput').value.trim();
  if(!text){showToast('请输入加料内容');return}
  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l);
  let count=0;
  for(let line of lines){
    const parts=line.split(/[\s,，\t]+/);
    if(parts.length<2)continue;
    const price=parseFloat(parts[parts.length-1]);
    const name=parts.slice(0,-1).join(' ');
    if(name && !isNaN(price) && price>=0){
      addMgmtAddonRow(name,price);
      count++;
    }
  }
  if(count>0){
    showToast(`已添加 ${count} 个加料项`);
    $('#batchMgmtInput').value='';
    $('#batchMgmtArea').style.display='none';
  }else{
    showToast('格式不对，请用"名称 价格"格式');
  }
}

function saveMgmtAddons(){
  const rows=$('#mgmtAddonList').children;
  const addons=[];
  for(let r of rows){
    const name=r.querySelector('.mgmt-addon-name').value.trim();
    const price=parseFloat(r.querySelector('.mgmt-addon-price').value);
    if(name && !isNaN(price) && price>=0){
      addons.push({name,price});
    }
  }
  DB.saveAddons(addons);
  // 同步更新所有菜品引用的加料价格
  state.dishes.forEach(d=>{
    if(d.addons&&d.addons.length){
      d.addons=d.addons.map(da=>{
        const global=addons.find(a=>a.name===da.name);
        return global?{name:global.name,price:global.price}:da;
      });
    }
  });
  DB.saveDishes(state.dishes);
  renderMenuMgmt();
  closeModal();
  showToast('✅ 加料项已保存');
}

// ========== 下拉刷新 ==========
function setupPullRefresh(){
  const scroll=$('#mainScroll');
  const hint=$('#pullHint');
  let startY=0,pulling=false,pullDist=0;
  const THRESHOLD=60; // 下拉60px触发刷新

  scroll.addEventListener('touchstart',e=>{
    if(scroll.scrollTop<=0){
      startY=e.touches[0].clientY;
      pulling=true;
      pullDist=0;
    }
  },{passive:true});

  scroll.addEventListener('touchmove',e=>{
    if(!pulling)return;
    pullDist=Math.max(0,e.touches[0].clientY-startY);
    if(pullDist>0){
      const d=Math.min(pullDist*0.5,80); // 阻尼效果
      hint.style.transform='translateY('+d+'px)';
      if(d>=THRESHOLD*0.5){
        hint.textContent='↑ 松开刷新';
        hint.classList.add('show');
      }else{
        hint.textContent='↓ 下拉刷新';
        hint.classList.add('show');
      }
    }
  },{passive:true});

  scroll.addEventListener('touchend',()=>{
    if(!pulling)return;
    pulling=false;
    hint.style.transform='';
    if(pullDist*0.5>=THRESHOLD*0.5){
      hint.innerHTML='<span class="spinner"></span>刷新中...';
      hint.classList.add('show');
      // 刷新当前页面数据
      setTimeout(()=>{
        refreshCurrentPage();
        hint.classList.remove('show');
        hint.textContent='↓ 下拉刷新';
        showToast('已刷新');
      },600);
    }else{
      hint.classList.remove('show');
    }
    pullDist=0;
  },{passive:true});
}

function refreshCurrentPage(){
  // 重新从存储加载数据
  state.dishes=DB.getDishes();
  state.orders=DB.getOrders();
  // 刷新当前页面
  const active=$('.page.active');
  if(!active)return;
  const id=active.id;
  if(id==='page-order'){renderCatTabs();renderDishes();renderCart()}
  else if(id==='page-orders')renderOrders();
  else if(id==='page-stats')renderStats();
  else if(id==='page-menu')renderMenuMgmt();
}

// ========== 初始化 ==========
function init(){
  state.dishes=DB.getDishes();
  state.orders=DB.getOrders();
  state.cart=DB.getCart();

  // 启动时后台检查云端是否有更新（不自动覆盖本地）
  if(CLOUD.isConfigured()){
    CLOUD.checkUpdate().then(cloudData=>{
      if(cloudData && cloudData.dishes){
        // 云端有新数据，提示用户
        const cloudTime=cloudData.syncTime?new Date(cloudData.syncTime).toLocaleString():'未知';
        const cloudCount=cloudData.dishes.length;
        const localCount=state.dishes.length;
        showToast('☁️ 云端有新数据（'+cloudCount+'个菜品），点同步设置查看', 3000);
        // 暂存供弹窗使用
        window._cloudUpdate={data:cloudData, time:cloudTime, count:cloudCount, localCount:localCount};
      }
    }).catch(()=>{});
  }

  // Tab 栏切换
  $$('.tabbar-item').forEach(t=>{
    t.addEventListener('click',()=>switchPage(t.dataset.page));
  });

  // 订单 tab
  $$('.order-tab').forEach(t=>{
    t.addEventListener('click',()=>{
      $$('.order-tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      state.orderFilter=t.dataset.status;
      renderOrders();
    });
  });

  // 统计范围
  $$('.stat-range-btn').forEach(t=>{
    t.addEventListener('click',()=>{
      $$('.stat-range-btn').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      state.statRange=t.dataset.range;
      renderStats();
    });
  });

  // 分类 tab
  $('#catTabs').addEventListener('click',e=>{
    if(e.target.classList.contains('cat-tab')){
      state.currentCategory=e.target.dataset.cat;
      renderCatTabs();
      renderDishes();
    }
  });

  // 搜索
  $('#searchInput').addEventListener('input',e=>{
    state.searchKeyword=e.target.value.trim();
    renderDishes();
  });

  // 整单备注实时存储
  $('#orderNoteInput').addEventListener('input',e=>{state.cart.orderNote=e.target.value;DB.saveCart(state.cart)});

  // 下单
  $('#placeOrderBtn').addEventListener('click',placeOrder);

  // 菜单管理按钮
  $('#addDishBtn').addEventListener('click',()=>{state.editingDish=null;showDishForm(null)});
  $('#addCatBtn').addEventListener('click',showAddCatForm);
  $('#batchDishBtn').addEventListener('click',()=>{
    state.menuBatchMode=!state.menuBatchMode;
    if(!state.menuBatchMode)state.menuSelected={};
    renderMenuMgmt();
  });
  $('#backupBtn').addEventListener('click',showBackupModal);
  $('#restoreBtn').addEventListener('click',showRestoreModal);
  $('#cloudBtn').addEventListener('click',showCloudModal);
  $('#addonMgmtBtn').addEventListener('click',showAddonMgmt);

  // 点击弹窗遮罩关闭
  $('#modalMask').addEventListener('click',e=>{
    if(e.target===$('#modalMask'))closeModal();
  });

  // 渲染首屏
  renderCatTabs();
  renderDishes();
  renderCart();

  // 下拉刷新
  setupPullRefresh();

  // 注册 Service Worker
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }

  // PWA 安装引导
  let deferredPrompt=null;
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();
    deferredPrompt=e;
    showInstallBanner(deferredPrompt);
  });
}

// 暴露给 onclick
window.addToCart=addToCart;
window.changeQty=changeQty;
window.removeFromCart=removeFromCart;
window.updateCartNote=updateCartNote;
window.openCheckout=openCheckout;

window.applyBatchMgmtAddon=applyBatchMgmtAddon;
window.saveMgmtAddons=saveMgmtAddons;
window.confirmAddToCart=confirmAddToCart;

// ========== Service Worker 自动更新 ==========
const APP_VERSION = '2.6';
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js?v='+APP_VERSION).then(function(reg){
    // 每次打开都检查更新
    reg.update();
  }).catch(function(e){
    console.log('SW注册失败:', e);
  });
}

init();
</script>
